<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" fill="none">
  <defs>
    <pattern id="halftoneDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.8" fill="#FFB347"></circle>
    </pattern>
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1"></stop>
      <stop offset="40%" stop-color="white" stop-opacity="0.8"></stop>
      <stop offset="70%" stop-color="white" stop-opacity="0.1"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </linearGradient>
    <mask id="halftoneMask">
      <rect width="200" height="200" fill="url(#fadeGradient)"></rect>
    </mask>
    <clipPath id="logoClip">
      <path d="M 120,20 A 80,80 0 1 0 120,180 Z"></path>
    </clipPath>
  </defs>
  <g clip-path="url(#logoClip)">
    <rect width="200" height="200" fill="url(#halftoneDots)" mask="url(#halftoneMask)"></rect>
  </g>
  <text x="140" y="85" font-family="Montserrat, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="2" fill="#F5F3EF">AXINITY</text>
  <text x="141" y="135" font-family="Montserrat, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="26" font-weight="200" letter-spacing="14" fill="#F5F3EF">PARTNERS</text>
</svg>