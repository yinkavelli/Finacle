<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" fill="none">
  <defs>
    <pattern id="halftoneDotsDark" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.8" fill="#C9A55A"></circle>
    </pattern>
    <linearGradient id="fadeGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1"></stop>
      <stop offset="40%" stop-color="white" stop-opacity="0.8"></stop>
      <stop offset="70%" stop-color="white" stop-opacity="0.1"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </linearGradient>
    <mask id="halftoneMaskDark">
      <rect width="200" height="200" fill="url(#fadeGradientDark)"></rect>
    </mask>
    <clipPath id="logoClipDark">
      <path d="M 120,20 A 80,80 0 1 0 120,180 Z"></path>
    </clipPath>
  </defs>
  <g clip-path="url(#logoClipDark)">
    <rect width="200" height="200" fill="url(#halftoneDotsDark)" mask="url(#halftoneMaskDark)"></rect>
  </g>
  <text x="140" y="85" font-family="Montserrat, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="2" fill="#0A0908">AXINITY</text>
  <text x="141" y="135" font-family="Montserrat, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="26" font-weight="200" letter-spacing="14" fill="#0A0908">PARTNERS</text>
</svg>